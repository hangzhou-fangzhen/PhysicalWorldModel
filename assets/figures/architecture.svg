<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Google Sans','Noto Sans',Roboto,Helvetica,Arial,sans-serif">
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- inputs -->
  <text x="40" y="34" font-size="13" font-weight="600" fill="#7a7a7a" letter-spacing="1">INPUT</text>

  <rect x="40" y="52" width="150" height="56" rx="8" fill="#f5f5f5" stroke="#dbdbdb"/>
  <text x="115" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#363636">Image</text>
  <text x="115" y="96" text-anchor="middle" font-size="11" fill="#7a7a7a">initial frame</text>

  <rect x="40" y="126" width="150" height="56" rx="8" fill="#f5f5f5" stroke="#dbdbdb"/>
  <text x="115" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#363636">Text</text>
  <text x="115" y="170" text-anchor="middle" font-size="11" fill="#7a7a7a">action description</text>

  <!-- arrows in -->
  <line x1="190" y1="80" x2="300" y2="150" stroke="#dbdbdb" stroke-width="2"/>
  <line x1="190" y1="154" x2="300" y2="168" stroke="#dbdbdb" stroke-width="2"/>

  <!-- model box -->
  <rect x="300" y="60" width="340" height="188" rx="12" fill="#363636"/>
  <text x="470" y="104" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Physical World Model</text>
  <text x="470" y="130" text-anchor="middle" font-size="12" fill="#cccccc">infers the physical initial condition,</text>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#cccccc">advances the fluid evolution,</text>
  <text x="470" y="170" text-anchor="middle" font-size="12" fill="#cccccc">then renders the appearance</text>
  <text x="470" y="212" text-anchor="middle" font-size="11" fill="#999999">fluid branch &#183; this release</text>

  <!-- arrows out -->
  <line x1="640" y1="104" x2="760" y2="76" stroke="#dbdbdb" stroke-width="2"/>
  <line x1="640" y1="140" x2="760" y2="150" stroke="#dbdbdb" stroke-width="2"/>
  <line x1="640" y1="190" x2="760" y2="224" stroke="#dbdbdb" stroke-width="2"/>

  <!-- outputs -->
  <text x="760" y="34" font-size="13" font-weight="600" fill="#7a7a7a" letter-spacing="1">OUTPUT</text>

  <rect x="760" y="48" width="160" height="52" rx="8" fill="#ffffff" stroke="#dbdbdb"/>
  <text x="840" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#363636">Image</text>
  <text x="840" y="88" text-anchor="middle" font-size="11" fill="#7a7a7a">predicted frame</text>

  <rect x="760" y="124" width="160" height="52" rx="8" fill="#ffffff" stroke="#dbdbdb"/>
  <text x="840" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#363636">Video</text>
  <text x="840" y="164" text-anchor="middle" font-size="11" fill="#7a7a7a">watchable / editable</text>

  <rect x="760" y="200" width="160" height="52" rx="8" fill="#ffffff" stroke="#dbdbdb"/>
  <text x="840" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#363636">Physical fields</text>
  <text x="840" y="240" text-anchor="middle" font-size="11" fill="#7a7a7a">pressure, velocity, ...</text>

  <!-- caption row -->
  <text x="40" y="330" font-size="11" fill="#b5b5b5">physical quantities are model predictions under explicit scale assumptions &#8212; not calibrated measurements</text>
</svg>
